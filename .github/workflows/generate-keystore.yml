name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate my-upload-key.jks
        run: |
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bcs123456 \
            -keypass bcs123456 \
            -dname "CN=Nahid Hasan, OU=BCS Literature, O=BCS Literature, L=Dhaka, S=Dhaka, C=BD"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key
          path: my-upload-key.jks
          retention-days: 7

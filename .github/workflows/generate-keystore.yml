name: Generate Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate and commit my-upload-key.jks
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass bcs123456 \
              -keypass bcs123456 \
              -dname "CN=Nahid Hasan, OU=BCS Literature, O=BCS Literature, L=Dhaka, S=Dhaka, C=BD"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add my-upload-key.jks
            git commit -m "Add release keystore"
            git push
          fi

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-upload-key
          path: my-upload-key.jks
          retention-days: 7

name: Build and Release BCS Literature APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure release keystore exists
        run: |
          if [ ! -f "${{ github.workspace }}/my-upload-key.jks" ]; then
            echo "Generating my-upload-key.jks for release signing..."
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass bcs123456 \
              -keypass bcs123456 \
              -dname "CN=Nahid Hasan, OU=BCS Literature, O=BCS Literature, L=Dhaka, S=Dhaka, C=BD"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add my-upload-key.jks
            git commit -m "Add release keystore [skip ci]"
            git push || echo "Could not push keystore back to repo, continuing build with generated keystore."
          fi

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'bcs123456' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'bcs123456' }}
        run: gradle assembleRelease --no-daemon

      - name: Prepare release APK file
        run: cp app/build/outputs/apk/release/app-release.apk BCS-Literature.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BCS Literature v1.0.${{ github.run_number }}
          body: Automated release build of BCS Literature Android APK.
          files: BCS-Literature.apk
